<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguros Fly — Panel Financiero LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0D0F12;--bg2:#13161A;--bg3:#1A1E24;--bg4:#21262E;--border:#2A3040;--border2:#333C4D;--text:#E8EDF5;--text2:#8A95A8;--text3:#525E70;--green:#2DD4A0;--red:#F06050;--blue:#4DA8F5;--purple:#9B8FEE;--amber:#F5B840;--mercury:#4DA8F5;--global:#2DD4A0;--otros:#9B8FEE}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}.shell{max-width:1180px;margin:0 auto;padding:24px 20px}.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:16px}.header-left h1{font-size:22px;font-weight:700;letter-spacing:-.4px}.header-left p{font-size:13px;color:var(--text2);margin-top:4px}.header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none}select:focus,input:focus{border-color:var(--blue)}.btn{border:1px solid var(--border2);background:var(--bg3);color:var(--text2);border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer}.btn:hover{border-color:var(--blue);color:var(--text)}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.acct-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.acct-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:30px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}.acct-pill.active-mercury{background:#4DA8F522;border-color:var(--mercury);color:var(--mercury)}.acct-pill.active-general{background:#2DD4A022;border-color:var(--global);color:var(--global)}.acct-pill.active-otros{background:#9B8FEE22;border-color:var(--otros);color:var(--otros)}.acct-pill.active-all{background:#E8EDF510;border-color:var(--border2);color:var(--text)}.tab-bar{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border)}.tab{padding:9px 16px;font-size:13px;font-weight:600;border-radius:8px 8px 0 0;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.tab:hover{color:var(--text2)}.tab.active{color:var(--text);border-bottom-color:var(--blue)}.filters{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.fg{display:flex;flex-direction:column;gap:4px}.fg label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}.check{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:12px;padding-bottom:8px}.check input{accent-color:var(--blue)}.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--blue))}.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.kpi-val{font-size:21px;font-weight:700;font-family:'DM Mono',monospace;color:var(--accent,var(--text))}.kpi-sub{font-size:11px;color:var(--text3);margin-top:5px}.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--text3)}.chart-section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}.section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scroll-x{overflow-x:auto}.tbl-section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}.tbl-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tbl-head span{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;font-weight:700;color:var(--text3);padding:10px 18px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}th:not(:first-child){text-align:right}td{padding:9px 18px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}td:not(:first-child){text-align:right;font-family:'DM Mono',monospace;font-size:12px}tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg3)}.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--text3)!important}.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}.b-mercury{background:#4DA8F522;color:var(--mercury)}.b-general{background:#2DD4A022;color:var(--global)}.b-otros{background:#9B8FEE22;color:var(--otros)}.bar-bg{background:var(--bg4);border-radius:2px;height:4px;margin-top:5px}.bar-fill{height:4px;border-radius:2px}.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:8px;border:1px solid;margin-bottom:12px;font-size:12px}.alert.warn{background:#F5B84010;border-color:#F5B84040;color:var(--amber)}.alert.good{background:#2DD4A010;border-color:#2DD4A040;color:var(--green)}.alert.bad{background:#F0605010;border-color:#F0605040;color:var(--red)}#loading,#errorBox{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;color:var(--text2)}#errorBox{display:none;color:var(--red);border-color:#F0605040}.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}td,th{padding:8px 10px}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="header-left"><h1>Seguros Fly — Panel Financiero LIVE</h1><p>Conectado a Google Sheets · <span id="lastUpdate"></span></p></div>
    <div class="header-right"><div class="status"><span class="dot"></span><span id="connStatus">Cargando…</span></div><button class="btn" onclick="reloadData()">↻ Actualizar</button></div>
  </div>

  <div id="loading"><span class="spinner"></span> Cargando datos desde Google Sheets…</div>
  <div id="errorBox"></div>

  <div class="acct-bar">
    <div class="acct-pill active-all" onclick="setAcct('all',this)"><span class="dot" style="background:var(--text2)"></span>Todas</div>
    <div class="acct-pill" onclick="setAcct('mercury',this)"><span class="dot" style="background:var(--mercury)"></span>Mercury USA</div>
    <div class="acct-pill" onclick="setAcct('general',this)"><span class="dot" style="background:var(--global)"></span>General_Global</div>
    <div class="acct-pill" onclick="setAcct('otros',this)"><span class="dot" style="background:var(--otros)"></span>Otros_Cuentas</div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="setView('resumen',this)">Resumen</button>
    <button class="tab" onclick="setView('cuentas',this)">Cuentas</button>
    <button class="tab" onclick="setView('socios',this)">Socios</button>
    <button class="tab" onclick="setView('pasarelas',this)">Pasarelas</button>
    <button class="tab" onclick="setView('egresos',this)">Egresos</button>
    <button class="tab" onclick="setView('detalle',this)">Detalle</button>
  </div>

  <div class="filters">
    <div class="fg"><label>Año</label><select id="yearSel" onchange="render()"><option value="all">Todos</option></select></div>
    <div class="fg"><label>Mes</label><select id="monthSel" onchange="render()"><option value="all">Todos</option></select></div>
    <div class="fg"><label>Agrupar gráficas</label><select id="grainSel" onchange="render()"><option value="month">Mes</option><option value="week">Semana</option><option value="day">Día</option><option value="quarter">Quarter</option></select></div>
    <label class="check"><input type="checkbox" id="excludeInternal" onchange="render()" checked> Excluir movimientos internos/autopay</label>
    <div class="fg" style="min-width:220px"><label>Buscar en detalle</label><input id="searchBox" oninput="render()" placeholder="Descripción, tipo, cuenta…"></div>
  </div>

  <div id="alerts"></div>
  <div id="kpiGrid" class="kpi-grid"></div>
  <div id="mainArea"></div>
</div>

<script>
const SHEET_ID='1-9073LxXGKAxXvwoUbcbwqklTKZAMpa4cVkpsqEmX3M';
const SHEETS=[
  {key:'mercury',label:'Mercury USA',sheet:'Mercury USA',color:'#4DA8F5'},
  {key:'general',label:'General_Global',sheet:'General_Global',color:'#2DD4A0'},
  {key:'otros',label:'Otros_Cuentas',sheet:'Otros_Cuentas',color:'#9B8FEE'}
];
const MES={1:'Ene',2:'Feb',3:'Mar',4:'Abr',5:'May',6:'Jun',7:'Jul',8:'Ago',9:'Sep',10:'Oct',11:'Nov',12:'Dic'};
let RAW=[],DATA=[],currentAcct='all',currentView='resumen',charts={};

const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
const fmt2=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const pct=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(n||0)+'%';
const csvURL=sheet=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}`;

function parseCSV(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cur+='"';i++;}else q=!q;continue;}if(c===','&&!q){row.push(cur);cur='';continue;}if((c==='\n'||c==='\r')&&!q){if(cur!==''||row.length){row.push(cur);rows.push(row);}cur='';row=[];if(c==='\r'&&n==='\n')i++;continue;}cur+=c;}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
function cleanNumber(v){if(v===null||v===undefined)return 0;let s=String(v).trim();if(!s||s==='#N/A')return 0;let neg=/^-|\(.*\)/.test(s);s=s.replace(/[^0-9,.-]/g,'');if(!s)return 0;if(s.includes('.')&&s.includes(',')){s=s.replace(/\./g,'').replace(',','.');}else if(s.includes(',')){s=s.replace(',','.');}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'');}let n=parseFloat(s);if(isNaN(n))return 0;return neg?-Math.abs(n):n;}
function findIdx(headers,aliases){for(const a of aliases){const an=norm(a);let i=headers.findIndex(h=>norm(h)===an);if(i>=0)return i;i=headers.findIndex(h=>norm(h).includes(an));if(i>=0)return i;}return -1;}
function getCell(r,i){return i>=0?(r[i]||'').toString().trim():'';}
function parseDate(raw,mes,año){let s=(raw||'').trim();if(!s&&mes&&año)return `${año}-${String(mes).padStart(2,'0')}-01`;let d=null;if(/^\d{4}-\d{1,2}-\d{1,2}/.test(s)){const p=s.split(/[ T]/)[0].split('-');d=new Date(+p[0],+p[1]-1,+p[2]);}else if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){const p=s.split(' ')[0].split('/').map(Number);d=new Date(p[2],p[1]-1,p[0]);}
 if(!d||isNaN(d))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function periodKey(date,grain){if(!date)return 'Sin fecha';const d=new Date(date+'T00:00:00');if(grain==='day')return date;if(grain==='quarter')return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;if(grain==='week'){const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);const sun=new Date(m);sun.setDate(m.getDate()+6);const f=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;return `${f(m)} al ${f(sun)}`;}return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function lbl(k){if(k.includes('-Q'))return k; if(k.includes(' al '))return k.replaceAll('-','/'); const [y,m]=k.split('-');return MES[+m]?`${MES[+m]} ${y}`:k;}
function isInternal(r){const t=norm(`${r.description} ${r.bankDescription} ${r.typeIn} ${r.typeOut}`);return t.includes('io autopay')||t.includes('mercury checking')||t.includes('mercury credit')||t.includes('conversion de divisas')||t.includes('conversión de divisas');}
function parseSheetRows(rows,meta){if(!rows.length)return[];let headerIdx=rows.findIndex(r=>r.some(c=>['fecha','date (utc)','description','descripcion'].includes(norm(c)))&&r.some(c=>norm(c).includes('ingreso')||norm(c).includes('amount')));if(headerIdx<0)headerIdx=0;const h=rows[headerIdx];const iDate=findIdx(h,['Fecha','Date (UTC)','Date']);const iDesc=findIdx(h,['Descripción','Description']);const iMov=findIdx(h,['Movimiento']);const iAmount=findIdx(h,['Amount']);const iIngresos=findIdx(h,['Ingresos','Ingreso']);let iEgresos=h.findIndex(x=>norm(x)==='egresos');if(iEgresos<0)iEgresos=findIdx(h,['Egresos','Egresos Monto']);const iSaldo=findIdx(h,['Saldo','Balance']);const iTypeIn=findIdx(h,['Tipo Ingresos','Tipo Ingreso']);const iTypeOut=findIdx(h,['Tipo Egresos','Tipo Egreso']);const iBank=findIdx(h,['Bank Description','Banco Descripción','Bank']);const iMes=findIdx(h,['Mes']);const iAno=findIdx(h,['Año','Ano','Year']);
 return rows.slice(headerIdx+1).map((r,idx)=>{const mes=cleanNumber(getCell(r,iMes));const ano=cleanNumber(getCell(r,iAno));let ingresos=cleanNumber(getCell(r,iIngresos));let egresos=cleanNumber(getCell(r,iEgresos));const amount=cleanNumber(getCell(r,iAmount));if(iAmount>=0&&(ingresos===0&&egresos===0)){if(amount>0)ingresos=amount;if(amount<0)egresos=Math.abs(amount);}const fecha=parseDate(getCell(r,iDate),mes,ano);if(!fecha&&(ingresos===0&&egresos===0))return null;const year=fecha?+fecha.slice(0,4):(ano||null);const month=fecha?+fecha.slice(5,7):(mes||null);return{ id:`${meta.key}-${idx}`,account:meta.key,accountLabel:meta.label,color:meta.color,date:fecha,year,month,description:getCell(r,iDesc),movement:getCell(r,iMov),bankDescription:getCell(r,iBank),ingresos,egresos,saldo:cleanNumber(getCell(r,iSaldo)),typeIn:getCell(r,iTypeIn),typeOut:getCell(r,iTypeOut),raw:r};}).filter(x=>x&&(x.ingresos||x.egresos||x.date));}
async function loadSheet(meta){const res=await fetch(csvURL(meta.sheet));if(!res.ok)throw new Error(`${meta.sheet}: HTTP ${res.status}`);const text=await res.text();if(text.startsWith('<'))throw new Error(`${meta.sheet}: no respondió como CSV. Revisa que esté compartido como público.`);return parseSheetRows(parseCSV(text),meta);}
async function reloadData(){document.getElementById('loading').style.display='block';document.getElementById('errorBox').style.display='none';document.getElementById('connStatus').textContent='Cargando…';try{const packs=await Promise.all(SHEETS.map(loadSheet));RAW=packs.flat();DATA=RAW;initFilters();document.getElementById('loading').style.display='none';document.getElementById('connStatus').textContent=`${DATA.length} filas cargadas`;document.getElementById('lastUpdate').textContent=new Date().toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});render();}catch(e){console.error(e);document.getElementById('loading').style.display='none';document.getElementById('errorBox').style.display='block';document.getElementById('errorBox').innerHTML=`<b>No se pudieron cargar los datos.</b><br>${e.message}<br><br>Verifica que el Sheet esté compartido como <b>Cualquiera con el enlace puede ver</b>.`;document.getElementById('connStatus').textContent='Error';}}
function initFilters(){const ySel=document.getElementById('yearSel'),mSel=document.getElementById('monthSel');const years=[...new Set(DATA.map(r=>r.year).filter(Boolean))].sort();ySel.innerHTML='<option value="all">Todos</option>'+years.map(y=>`<option value="${y}" ${y===2026?'selected':''}>${y}</option>`).join('');mSel.innerHTML='<option value="all">Todos</option>'+Object.entries(MES).map(([n,l])=>`<option value="${n}">${l}</option>`).join('');}
function filtered(){const y=document.getElementById('yearSel').value,m=document.getElementById('monthSel').value,q=norm(document.getElementById('searchBox').value),ex=document.getElementById('excludeInternal').checked;return DATA.filter(r=>{if(currentAcct!=='all'&&r.account!==currentAcct)return false;if(y!=='all'&&String(r.year)!==y)return false;if(m!=='all'&&String(r.month)!==m)return false;if(ex&&isInternal(r))return false;if(q&&!norm(`${r.description} ${r.movement} ${r.bankDescription} ${r.typeIn} ${r.typeOut} ${r.accountLabel}`).includes(q))return false;return true;});}
function setAcct(a,el){currentAcct=a;document.querySelectorAll('.acct-pill').forEach(p=>p.className='acct-pill');el.classList.add(`active-${a}`);render();}
function setView(v,el){currentView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
function dc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function groupBy(rows,keyFn){const m={};rows.forEach(r=>{const k=keyFn(r);if(!m[k])m[k]=[];m[k].push(r);});return m;}
function sum(rows,field){return rows.reduce((s,r)=>s+(+r[field]||0),0);}
function getTotals(rows){const i=sum(rows,'ingresos'),e=sum(rows,'egresos');return{ingresos:i,egresos:e,balance:i-e,ratio:i?e/i*100:0};}
function render(){if(!DATA.length)return;const rows=filtered();const t=getTotals(rows);const byAcc=groupBy(rows,r=>r.account);setAlerts(t,rows);setKPI(t,rows,byAcc);if(currentView==='resumen')renderResumen(rows);else if(currentView==='cuentas')renderCuentas(rows);else if(currentView==='socios')renderSocios(rows);else if(currentView==='pasarelas')renderPasarelas(rows);else if(currentView==='egresos')renderEgresos(rows);else renderDetalle(rows);}
function setAlerts(t,rows){let a=[];if(t.ratio>90)a.push(['bad',`Ratio gasto/ingreso alto: <b>${pct(t.ratio)}</b>.`]);else if(t.ratio>70)a.push(['warn',`Ratio gasto/ingreso en observación: <b>${pct(t.ratio)}</b>.`]);if(t.balance>0)a.push(['good',`Balance positivo del periodo: <b>${fmt(t.balance)}</b>.`]);if(!rows.length)a.push(['warn','No hay filas para los filtros seleccionados.']);document.getElementById('alerts').innerHTML=a.map(x=>`<div class="alert ${x[0]}">${x[1]}</div>`).join('');}
function setKPI(t,rows,byAcc){const accs=Object.keys(byAcc).length,avgI=rows.length?t.ingresos/Math.max(1,new Set(rows.map(r=>`${r.year}-${r.month}`)).size):0;document.getElementById('kpiGrid').innerHTML=[
 {l:'Ingresos',v:fmt(t.ingresos),s:`${rows.filter(r=>r.ingresos>0).length} movimientos`,c:'var(--green)'},
 {l:'Egresos',v:fmt(t.egresos),s:`${rows.filter(r=>r.egresos>0).length} movimientos`,c:'var(--red)'},
 {l:'Balance neto',v:fmt(t.balance),s:t.balance>=0?'Superávit':'Déficit',c:t.balance>=0?'var(--green)':'var(--red)'},
 {l:'Ratio gasto/ingreso',v:pct(t.ratio),s:'Egresos / Ingresos',c:t.ratio<70?'var(--green)':t.ratio<90?'var(--amber)':'var(--red)'},
 {l:'Prom. ingreso/mes',v:fmt(avgI),s:'Según filtros',c:'var(--blue)'},
 {l:'Cuentas activas',v:accs,s:'Con movimiento',c:'var(--purple)'}
].map(k=>`<div class="kpi" style="--accent:${k.c}"><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join('');}
function baseChartOptions(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8A95A8'}},tooltip:{backgroundColor:'#0D0F12',titleColor:'#E8EDF5',bodyColor:'#8A95A8',padding:10,cornerRadius:8}},scales:{x:{ticks:{color:'#8A95A8'},grid:{color:'#21262E'}},y:{ticks:{color:'#8A95A8'},grid:{color:'#21262E'}}}};}
function renderResumen(rows){const grain=document.getElementById('grainSel').value;const byP=groupBy(rows,r=>periodKey(r.date,grain));const keys=Object.keys(byP).sort();document.getElementById('mainArea').innerHTML=`<div class="chart-section"><div class="section-title">Ingresos vs Egresos</div><div style="height:300px"><canvas id="cMain"></canvas></div></div><div class="grid2"><div class="tbl-section"><div class="tbl-head"><span>Resumen por periodo</span></div><div class="scroll-x"><table><thead><tr><th>Periodo</th><th>Ingresos</th><th>Egresos</th><th>Balance</th><th>Ratio</th></tr></thead><tbody>${keys.map(k=>{const t=getTotals(byP[k]);return`<tr><td>${lbl(k)}</td><td class="pos">${fmt(t.ingresos)}</td><td class="neg">${fmt(t.egresos)}</td><td class="${t.balance>=0?'pos':'neg'}">${fmt(t.balance)}</td><td>${pct(t.ratio)}</td></tr>`}).join('')}</tbody></table></div></div><div class="chart-section"><div class="section-title">Balance por periodo</div><div style="height:260px"><canvas id="cBal"></canvas></div></div></div>`;dc('main');charts.main=new Chart(document.getElementById('cMain'),{type:'bar',data:{labels:keys.map(lbl),datasets:[{label:'Ingresos',data:keys.map(k=>sum(byP[k],'ingresos')),backgroundColor:'#2DD4A066',borderColor:'#2DD4A0',borderWidth:1},{label:'Egresos',data:keys.map(k=>sum(byP[k],'egresos')),backgroundColor:'#F0605066',borderColor:'#F06050',borderWidth:1}]},options:baseChartOptions()});dc('bal');charts.bal=new Chart(document.getElementById('cBal'),{type:'line',data:{labels:keys.map(lbl),datasets:[{label:'Balance',data:keys.map(k=>getTotals(byP[k]).balance),borderColor:'#4DA8F5',backgroundColor:'#4DA8F522',fill:true,tension:.35}]},options:baseChartOptions()});}
function renderCuentas(rows){const by=groupBy(rows,r=>r.account);const labels=SHEETS.map(s=>s.label);document.getElementById('mainArea').innerHTML=`<div class="grid3">${SHEETS.map(s=>{const t=getTotals(by[s.key]||[]);return`<div class="kpi" style="--accent:${s.color}"><div class="kpi-label">${s.label}</div><div class="kpi-val">${fmt(t.balance)}</div><div class="kpi-sub">Ingresos ${fmt(t.ingresos)} · Egresos ${fmt(t.egresos)}</div></div>`}).join('')}</div><div class="chart-section"><div class="section-title">Comparación por cuenta</div><div style="height:300px"><canvas id="cAcc"></canvas></div></div>`;dc('acc');charts.acc=new Chart(document.getElementById('cAcc'),{type:'bar',data:{labels,datasets:[{label:'Ingresos',data:SHEETS.map(s=>sum(by[s.key]||[],'ingresos')),backgroundColor:'#2DD4A066'},{label:'Egresos',data:SHEETS.map(s=>sum(by[s.key]||[],'egresos')),backgroundColor:'#F0605066'},{label:'Balance',data:SHEETS.map(s=>getTotals(by[s.key]||[]).balance),backgroundColor:'#4DA8F566'}]},options:baseChartOptions()});}
function categoryRows(rows,field,type){const by=groupBy(rows,r=>(r[field]||'Sin clasificar').trim()||'Sin clasificar');return Object.keys(by).map(k=>({label:k,val:sum(by[k],type),count:by[k].length})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val);}
function renderSocios(rows){const arr=categoryRows(rows,'typeIn','ingresos');const total=arr.reduce((s,x)=>s+x.val,0)||1;document.getElementById('mainArea').innerHTML=`<div class="chart-section"><div class="section-title">Ingresos por socio / fuente</div><div style="height:310px"><canvas id="cSoc"></canvas></div></div><div class="tbl-section"><div class="tbl-head"><span>Detalle de ingresos</span></div><table><thead><tr><th>Fuente</th><th>Monto</th><th>Share</th><th>Mov.</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.label}</td><td class="pos">${fmt(x.val)}</td><td>${pct(x.val/total*100)}<div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,x.val/total*100)}%;background:var(--green)"></div></div></td><td>${x.count}</td></tr>`).join('')}</tbody></table></div>`;dc('soc');charts.soc=new Chart(document.getElementById('cSoc'),{type:'bar',data:{labels:arr.slice(0,12).map(x=>x.label),datasets:[{label:'Ingresos',data:arr.slice(0,12).map(x=>x.val),backgroundColor:'#2DD4A066',borderColor:'#2DD4A0',borderWidth:1}]},options:{...baseChartOptions(),indexAxis:'y'}});}
function renderPasarelas(rows){const pass=rows.filter(r=>norm(`${r.description} ${r.typeIn} ${r.bankDescription}`).includes('stripe')||norm(`${r.description} ${r.typeIn} ${r.bankDescription}`).includes('dlocal')||norm(`${r.description} ${r.typeIn} ${r.bankDescription}`).includes('cashback'));const arr=categoryRows(pass,'typeIn','ingresos');document.getElementById('mainArea').innerHTML=`<div class="chart-section"><div class="section-title">Ingresos de pasarelas</div><div style="height:300px"><canvas id="cPas"></canvas></div></div><div class="tbl-section"><div class="tbl-head"><span>Pasarelas detectadas</span></div><table><thead><tr><th>Pasarela / tipo</th><th>Ingresos</th><th>Movimientos</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.label}</td><td class="pos">${fmt(x.val)}</td><td>${x.count}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No hay datos de pasarelas con los filtros actuales.</td></tr>'}</tbody></table></div>`;dc('pas');charts.pas=new Chart(document.getElementById('cPas'),{type:'doughnut',data:{labels:arr.map(x=>x.label),datasets:[{data:arr.map(x=>x.val),backgroundColor:['#4DA8F5','#2DD4A0','#9B8FEE','#F5B840','#F06050']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8A95A8'}}}}});}
function renderEgresos(rows){const arr=categoryRows(rows,'typeOut','egresos');const total=arr.reduce((s,x)=>s+x.val,0)||1;document.getElementById('mainArea').innerHTML=`<div class="chart-section"><div class="section-title">Top egresos por categoría</div><div style="height:340px"><canvas id="cEgr"></canvas></div></div><div class="tbl-section"><div class="tbl-head"><span>Detalle de egresos</span></div><table><thead><tr><th>Categoría</th><th>Monto</th><th>Share</th><th>Mov.</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.label}</td><td class="neg">${fmt(x.val)}</td><td>${pct(x.val/total*100)}<div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,x.val/total*100)}%;background:var(--red)"></div></div></td><td>${x.count}</td></tr>`).join('')}</tbody></table></div>`;dc('egr');charts.egr=new Chart(document.getElementById('cEgr'),{type:'bar',data:{labels:arr.slice(0,15).map(x=>x.label),datasets:[{label:'Egresos',data:arr.slice(0,15).map(x=>x.val),backgroundColor:'#F0605066',borderColor:'#F06050',borderWidth:1}]},options:{...baseChartOptions(),indexAxis:'y'}});}
function accBadge(r){return `<span class="badge b-${r.account}">${r.accountLabel}</span>`;}
function renderDetalle(rows){const sorted=[...rows].sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('mainArea').innerHTML=`<div class="tbl-section"><div class="tbl-head"><span>Detalle de movimientos</span><span>${sorted.length} filas</span></div><div class="scroll-x"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Descripción</th><th>Tipo ingreso</th><th>Tipo egreso</th><th>Ingresos</th><th>Egresos</th><th>Saldo</th></tr></thead><tbody>${sorted.slice(0,500).map(r=>`<tr><td>${r.date||'—'}</td><td>${accBadge(r)}</td><td style="text-align:left;font-family:'DM Sans';max-width:320px">${r.description||r.bankDescription||'—'}</td><td>${r.typeIn||'—'}</td><td>${r.typeOut||'—'}</td><td class="pos">${r.ingresos?fmt2(r.ingresos):'—'}</td><td class="neg">${r.egresos?fmt2(r.egresos):'—'}</td><td>${r.saldo?fmt2(r.saldo):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;}
document.addEventListener('DOMContentLoaded',reloadData);
</script>
</body>
</html>
