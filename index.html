<title>Dashboard Cuentas SegurosFly</title>

<style>
:root{--bg:#0D0F12;--bg2:#13161A;--bg3:#1A1E24;--bg4:#21262E;--border:#2A3040;--border2:#333C4D;--text:#E8EDF5;--text2:#8A95A8;--text3:#525E70;--green:#2DD4A0;--red:#F06050;--blue:#4DA8F5;--purple:#9B8FEE;--amber:#F5B840;--pink:#F06090}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{font-size:.88rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.nav-right{display:flex;align-items:center;gap:10px}
.live-badge{font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge-local{background:#1a140a;color:var(--amber);border-color:#3a2d0a}
.badge-live{background:#0a3325;color:var(--green);border-color:#1a5c3a}
.last-upd{font-size:.7rem;color:var(--text3)}
.live-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-local{background:var(--amber)}
.dot-live{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-reload{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:7px;padding:5px 13px;font-size:.73rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}
.btn-reload:hover{border-color:var(--blue);color:var(--blue);background:rgba(77,168,245,.08)}
.btn-reload.loading{opacity:.5;pointer-events:none}
.btn-reload.loading .ricon{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay{position:fixed;inset:0;background:rgba(13,15,18,.88);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#overlay.show{display:flex}
.sp{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.ov-msg{font-size:.82rem;color:var(--text2)}
#toast{position:fixed;bottom:22px;right:22px;padding:9px 15px;border-radius:9px;font-size:.78rem;font-weight:500;z-index:300;opacity:0;transform:translateY(6px);transition:all .22s;pointer-events:none;border:1px solid}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--bg2);border-color:var(--green);color:var(--green)}
#toast.err{background:var(--bg2);border-color:var(--red);color:var(--red)}
.banner{background:var(--bg2);border:1px solid var(--border2);border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:.76rem;color:var(--text2);display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.banner.live{border-color:#1a5c3a}
.shell{max-width:1100px;margin:0 auto;padding:22px 20px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:14px}
.hd h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.hd p{font-size:12px;color:var(--text2);margin-top:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
select:focus{border-color:var(--blue)}
.tab-bar{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:9px 16px;font-size:12px;font-weight:600;background:transparent;border:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'DM Sans',sans-serif;transition:all .15s}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--text);border-bottom-color:var(--blue)}
.eg-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.eg-filters label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;display:block;margin-bottom:3px}
.eg-filters select{font-size:11px;padding:5px 10px}
.reset-btn{background:var(--bg3);color:var(--text3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.reset-btn:hover{border-color:var(--red);color:var(--red)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:4px 11px;font-size:11px;font-weight:600;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.chip.on{background:#4DA8F520;border-color:var(--blue);color:var(--blue)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac,var(--blue))}
.kpi-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kpi-v{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:var(--ac,var(--text))}
.kpi-s{font-size:11px;color:var(--text3);margin-top:4px}
.cs{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.st{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.ts{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.th2{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.th2 span{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);padding:10px 16px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
th:not(:first-child){text-align:right}
td{padding:9px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
td:not(:first-child){text-align:right;font-family:'DM Mono',monospace;font-size:11px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar-bg{background:var(--bg4);border-radius:2px;height:4px;margin-top:5px}
.bar-fill{height:4px;border-radius:2px}
.dot2{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.badge-cat{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;background:var(--bg3);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.td-left{text-align:left !important;font-family:'DM Sans',sans-serif !important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.scroll-x{overflow-x:auto}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function parseCSV(text){
  var rows=[],cur='',inQ=false,row=[];
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='"'){inQ=!inQ;continue;}
    if(c===','&&!inQ){row.push(cur.trim());cur='';continue;}
    if((c==='\n'||c==='\r')&&!inQ){if(cur||row.length){row.push(cur.trim());rows.push(row);}cur='';row=[];if(c==='\r'&&text[i+1]==='\n')i++;continue;}
    cur+=c;
  }
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows;
}
function cleanNum(s){
  if(!s)return 0;
  var n=parseFloat(String(s).replace(/[$\s]/g,'').replace(/\./g,'').replace(',','.'));
  return isNaN(n)?0:Math.abs(n);
}
function parseMes(s){
  if(s===null||s===undefined)return NaN;
  var raw=String(s).trim();
  if(!raw)return NaN;
  var n=parseInt(raw,10);
  if(!isNaN(n)&&n>=1&&n<=12)return n;
  var t=raw.toLowerCase().replace(/\./g,'').replace(/[áéíóú]/g,function(c){return {'á':'a','é':'e','í':'i','ó':'o','ú':'u'}[c];});
  var map={'ene':1,'enero':1,'jan':1,'january':1,
           'feb':2,'febrero':2,'february':2,
           'mar':3,'marzo':3,'march':3,
           'abr':4,'abril':4,'apr':4,'april':4,
           'may':5,'mayo':5,
           'jun':6,'junio':6,'june':6,
           'jul':7,'julio':7,'july':7,
           'ago':8,'agosto':8,'aug':8,'august':8,
           'sep':9,'sept':9,'septiembre':9,'september':9,
           'oct':10,'octubre':10,'october':10,
           'nov':11,'noviembre':11,'november':11,
           'dic':12,'diciembre':12,'dec':12,'december':12};
  if(map[t]!==undefined)return map[t];
  var k=Object.keys(map).find(function(key){return t.indexOf(key)===0;});
  return k?map[k]:NaN;
}
function parseAnio(s){
  if(s===null||s===undefined)return NaN;
  var raw=String(s).trim();
  if(!raw)return NaN;
  var n=parseInt(raw,10);
  if(isNaN(n))return NaN;
  if(n>=20&&n<=99)return 2000+n;
  return n;
}

function parseSheetTab(text, tabName, nS, nEM, nP, diag){
  var rows=parseCSV(text);
  if(rows.length<2)throw new Error('Pesta\u00f1a "'+tabName+'" parece vacia.');
  var hdrIdx=-1;
  for(var i=0;i<Math.min(rows.length,60);i++){
    var r=rows[i].map(function(h){return h.toLowerCase().trim();}).join(',');
    if(r.includes('mes')&&r.includes('tipo')){hdrIdx=i;break;}
  }
  if(hdrIdx<0)throw new Error('No se encontro encabezado en pesta\u00f1a "'+tabName+'".');
  var header=rows[hdrIdx].map(function(h){return h.toLowerCase().trim();});
  function findCol(exacts,partials){
    for(var e=0;e<exacts.length;e++){var i=header.indexOf(exacts[e]);if(i>=0)return i;}
    if(partials)for(var p=0;p<partials.length;p++){var j=header.findIndex(function(h){return h.includes(partials[p]);});if(j>=0)return j;}
    return -1;
  }
  var iMes=findCol(['mes','month'],['mes']),
      iAnio=findCol(['a\u00f1o','anio','year'],['a\u00f1o','anio','year']),
      iAmount=findCol(['amount','monto','valor','importe'],['amount','monto','importe']),
      iTipoIn=header.findIndex(function(h){return h.includes('tipo ingreso')||h.includes('tipo ingresos');}),
      iTipoEg=header.findIndex(function(h){return h.includes('tipo egreso')||h.includes('tipo egresos');}),
      iCat=findCol(['categor\u00eda','categoria','category'],['categor']),
      iSub=findCol(['sub categor\u00eda','sub categoria','subcategoria'],['sub cat','subcat']),
      iTipo=findCol(['tipo']),
      iGrupo=findCol(['grupo','group']);
  if(iMes<0||iAnio<0)throw new Error('Pesta\u00f1a "'+tabName+'": no se encontraron columnas Mes/Anio.');
  var cols={iMes:iMes,iAnio:iAnio,iAmount:iAmount,iTipoIn:iTipoIn,iTipoEg:iTipoEg,iCat:iCat,iSub:iSub,iTipo:iTipo,iGrupo:iGrupo};
  var tabDiag={tab:tabName,total:0,procesadas:0,sinFecha:0,sinMonto:0,sinTipo:0,socio:0,stripe:0,dlocal:0,cashback:0,invLR:0,invJT:0,excluido:0,egresos:0};
  rows.slice(hdrIdx+1).forEach(function(row){
    if(!row||row.length===0||row.every(function(c){return !c||!String(c).trim();}))return;
    diag.total++; tabDiag.total++;
    var mes=parseMes(row[iMes]), anio=parseAnio(row[iAnio]);
    if(isNaN(mes)||isNaN(anio)||mes<1||mes>12||anio<2020){
      diag.sinFecha++; tabDiag.sinFecha++;
      if(diag.muestraSaltadas.length<6)diag.muestraSaltadas.push({razon:'fecha',tab:tabName,mes:row[iMes],anio:row[iAnio]});
      return;
    }
    var mk=anio+'-'+mes;
    var amount=iAmount>=0?cleanNum(row[iAmount]):0;
    if(amount<=0){
      diag.sinMonto++; tabDiag.sinMonto++;
      if(diag.muestraSaltadas.length<6)diag.muestraSaltadas.push({razon:'monto',tab:tabName,monto:row[iAmount],mk:mk});
      return;
    }
    diag.procesadas++; tabDiag.procesadas++;
    var tipoIn=iTipoIn>=0?(row[iTipoIn]||'').trim():'';
    var tipoEg=iTipoEg>=0?(row[iTipoEg]||'').trim():'';
    var cat=iCat>=0?(row[iCat]||'').trim():'';
    var sub=iSub>=0?(row[iSub]||'').trim():'';
    var tipo=iTipo>=0?(row[iTipo]||'').trim():'';
    var grupo=iGrupo>=0?(row[iGrupo]||'').trim():'';
    if(tipoIn){
      var tl=tipoIn.toLowerCase();
      diag.tipoInVals[tipoIn]=(diag.tipoInVals[tipoIn]||0)+amount;
      if(!diag.tipoInPerTab[tipoIn])diag.tipoInPerTab[tipoIn]={};
      diag.tipoInPerTab[tipoIn][tabName]=(diag.tipoInPerTab[tipoIn][tabName]||0)+amount;
      if(tl.includes('stripe')){nP.Stripe[mk]=(nP.Stripe[mk]||0)+amount;diag.tipoInRouted.stripe+=amount;tabDiag.stripe+=amount;}
      else if(tl.includes('dlocal')||tl.includes('pingpong')){nP.Dlocal[mk]=(nP.Dlocal[mk]||0)+amount;diag.tipoInRouted.dlocal+=amount;tabDiag.dlocal+=amount;}
      else if(tl.includes('cashback')){nP['Mercury Cashback'][mk]=(nP['Mercury Cashback'][mk]||0)+amount;diag.tipoInRouted.cashback+=amount;tabDiag.cashback+=amount;}
      else if(tl.includes('inversion lr')||(tl.includes('inversion')&&tl.includes('lr'))){nP['Inversion LR'][mk]=(nP['Inversion LR'][mk]||0)+amount;diag.tipoInRouted.invLR+=amount;tabDiag.invLR+=amount;}
      else if(tl.includes('inversion jt')||(tl.includes('inversion')&&tl.includes('jt'))){nP['Inversion JT'][mk]=(nP['Inversion JT'][mk]||0)+amount;diag.tipoInRouted.invJT+=amount;tabDiag.invJT+=amount;}
      else if(tl.includes('inversion')){nP['Inversion LR'][mk]=(nP['Inversion LR'][mk]||0)+amount;diag.tipoInRouted.invLR+=amount;tabDiag.invLR+=amount;}
      else if(!tl.includes('interes')&&!tl.includes('global')&&tipoIn.length>1){if(!nS[tipoIn])nS[tipoIn]={};nS[tipoIn][mk]=(nS[tipoIn][mk]||0)+amount;diag.tipoInRouted.socio+=amount;tabDiag.socio+=amount;}
      else{diag.tipoInRouted.excluido+=amount;tabDiag.excluido+=amount;}
    }
    if(tipoEg&&tipoEg.length>1){
      if(!nEM[tipoEg])nEM[tipoEg]={data:{},cat:cat||'Otros',sub:sub||'Otros',tipo:tipo||'',grupo:grupo||tipoEg};
      nEM[tipoEg].data[mk]=(nEM[tipoEg].data[mk]||0)+amount;
      if(cat)nEM[tipoEg].cat=cat; if(sub)nEM[tipoEg].sub=sub; if(tipo)nEM[tipoEg].tipo=tipo; if(grupo)nEM[tipoEg].grupo=grupo;
      tabDiag.egresos+=amount;
    }
    if(!tipoIn&&!tipoEg){
      diag.sinTipo++; tabDiag.sinTipo++;
      if(diag.muestraSaltadas.length<6)diag.muestraSaltadas.push({razon:'sin tipo',tab:tabName,mk:mk,monto:amount});
    }
  });
  diag.tabs.push(tabDiag);
  diag.headers[tabName]={header:header,cols:cols};
  return {header:header,cols:cols};
}

// Fetch con reintentos anti-CORS: directo → allorigins → corsproxy.io
async function fetchTabCSV(tab){
  var base='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+tab.gid;
  var bust='&t='+Date.now();
  // Intento 1: directo
  try{
    var r=await fetch(base+bust,{cache:'no-store'});
    if(r.ok){var t=await r.text();if(t.length>50&&!t.trim().startsWith('<!'))return{tab:tab,text:t};}
  }catch(e){}
  // Intento 2: allorigins
  try{
    var r2=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(base),{cache:'no-store'});
    if(r2.ok){var t2=await r2.text();if(t2.length>50&&!t2.trim().startsWith('<!'))return{tab:tab,text:t2};}
  }catch(e){}
  // Intento 3: corsproxy.io
  try{
    var r3=await fetch('https://corsproxy.io/?'+encodeURIComponent(base),{cache:'no-store'});
    if(r3.ok){var t3=await r3.text();if(t3.length>50&&!t3.trim().startsWith('<!'))return{tab:tab,text:t3};}
  }catch(e){}
  throw new Error('No se pudo obtener la pestaña "'+tab.name+'". Verifica que el Sheet sea público (Compartir → Cualquier persona con el enlace).');
}

async function reloadFromSheet(){
  setLoading(true,'Conectando con Google Sheets ('+SHEET_TABS.length+' pesta\u00f1as)...');
  try{
    var fetches=SHEET_TABS.map(function(tab){return fetchTabCSV(tab);});
    var results=await Promise.all(fetches);
    setLoading(true,'Procesando datos de '+results.length+' pesta\u00f1as...');
    var nS={}, nEM={}, nP={Stripe:{},Dlocal:{},'Mercury Cashback':{},'Inversion LR':{},'Inversion JT':{}};

      : 'Mayo 2025 viene del respaldo local (el Sheet arranca en '+primerMesSheet+')';
    var colorPanel=hayMayoSheet?'var(--green)':'var(--amber)';
    var bgPanel=hayMayoSheet?'#0a3325':'#1a140a';
    var bdPanel=hayMayoSheet?'#1a5c3a':'#3a2d0a';
    var rt=diag.tipoInRouted;
    var fmtUSD=function(n){return '$'+Math.round(n).toLocaleString('es-CO');};
    var tipoInList=Object.keys(diag.tipoInVals).sort(function(a,b){return diag.tipoInVals[b]-diag.tipoInVals[a];});
    var tipoInHtml=tipoInList.map(function(name){
      var tl=name.toLowerCase();
      var destino='Socio';
      if(tl.includes('stripe'))destino='Stripe';
      else if(tl.includes('dlocal')||tl.includes('pingpong'))destino='Dlocal';
      else if(tl.includes('cashback'))destino='Cashback';
      else if(tl.includes('inversion lr')||(tl.includes('inversion')&&tl.includes('lr')))destino='Inversion LR';
      else if(tl.includes('inversion jt')||(tl.includes('inversion')&&tl.includes('jt')))destino='Inversion JT';
      else if(tl.includes('inversion'))destino='Inversion LR';
      else if(tl.includes('interes'))destino='EXCLUIDO (interes)';
      else if(tl.includes('global'))destino='EXCLUIDO (global)';
      else if(name.length<=1)destino='EXCLUIDO (vacio)';
      var color=destino.indexOf('EXCLUIDO')===0?'var(--red)':destino==='Socio'?'var(--green)':'var(--blue)';
      return '<tr><td style="padding:2px 8px 2px 0">'+name+'</td><td style="padding:2px 8px;text-align:right;font-family:DM Mono,monospace">'+fmtUSD(diag.tipoInVals[name])+'</td><td style="padding:2px 0;color:'+color+'">'+destino+'</td></tr>';
    }).join('');
    var diagHtml='<div style="background:'+bgPanel+';border:1px solid '+bdPanel+';border-radius:9px;padding:12px 14px;margin-bottom:14px;font-size:.78rem;color:var(--text)" id="diagPanel">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div style="flex:1">'
      +'<div style="font-weight:700;margin-bottom:6px;color:'+colorPanel+'">'+tituloPanel+'</div>'
      +'<div style="color:var(--text2);line-height:1.6">'
      +'<b>Columnas detectadas:</b> Mes = col '+iMes+' ("'+colNombre(iMes)+'") &middot; Año = col '+iAnio+' ("'+colNombre(iAnio)+'") &middot; Monto = col '+iAmount+' ("'+colNombre(iAmount)+'")<br>'
      +'<b>Filas Sheet:</b> '+diag.total+' totales &middot; '+diag.procesadas+' OK &middot; '+diag.sinFecha+' sin fecha &middot; '+diag.sinMonto+' sin monto &middot; '+diag.sinTipo+' sin tipo<br>'
      +'<b>Meses en el Sheet ('+mesesOrdenados.length+'):</b> '+(mesesOrdenados.join(', ')||'ninguno')+'<br>'
      +'<b>Ruteo desde "tipo ingresos":</b> Socios '+fmtUSD(rt.socio)+' &middot; Stripe '+fmtUSD(rt.stripe)+' &middot; Dlocal '+fmtUSD(rt.dlocal)+' &middot; Cashback '+fmtUSD(rt.cashback)+' &middot; Inv.LR '+fmtUSD(rt.invLR)+' &middot; Inv.JT '+fmtUSD(rt.invJT)+' &middot; Excluido '+fmtUSD(rt.excluido)+'<br>'
      +(hayMayoSheet?'':'<b style="color:var(--amber)">Para meses anteriores a '+primerMesSheet+' se usan los datos locales hardcodeados (Global66, etc.). Esos no se actualizan desde el Sheet.</b><br>')
      +'<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--blue)">Ver desglose por valor de "tipo ingresos" ('+tipoInList.length+' distintos)</summary>'
      +'<table style="margin-top:6px;font-size:.74rem"><thead><tr style="color:var(--text3)"><th style="text-align:left;padding:2px 8px 4px 0">tipo ingresos</th><th style="text-align:right;padding:2px 8px 4px">Total Sheet</th><th style="text-align:left;padding:2px 0 4px">Clasificado como</th></tr></thead><tbody>'+tipoInHtml+'</tbody></table>'
      +'</details>'
      +'<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--blue)">Ver header completo</summary>'
      +'<div style="font-family:DM Mono,monospace;font-size:.72rem;color:var(--text3);margin-top:4px">'+header.map(function(h,i){return i+':'+h;}).join(' | ')+'</div>'
      +'</details>'
      +'</div></div>'
      +'<button onclick="document.getElementById(\'diagPanel\').remove()" style="background:transparent;border:1px solid var(--border2);color:var(--text3);border-radius:6px;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:.7rem">cerrar</button>'
      +'</div>';
    if(diag.sinFecha>0&&diag.muestraSaltadas.length){
      var ejemplos=diag.muestraSaltadas.filter(function(s){return s.razon==='fecha';}).slice(0,3);
      if(ejemplos.length){
        diagHtml=diagHtml.replace('</div></div><button',
          '<br><b style="color:var(--amber)">Ejemplos de filas con fecha inválida:</b><br>'
          +ejemplos.map(function(e){return '&nbsp;&nbsp;Mes="'+e.mes+'" Año="'+e.anio+'"';}).join('<br>')
          +'</div></div><button');
      }
    }
    // MERGE inteligente: el Sheet manda en los meses que trae; los meses anteriores se preservan del respaldo local.
    var mesesSheet=new Set(mesesOrdenados);
    function purgeMesesSheet(obj){
      Object.keys(obj).forEach(function(k){
        var d=obj[k].data||obj[k];
        Object.keys(d).forEach(function(mk){if(mesesSheet.has(mk))delete d[mk];});
      });
    }
    if(Object.keys(nS).length>0){
      purgeMesesSheet(SOCIOS);
      Object.keys(nS).forEach(function(socio){
        if(!SOCIOS[socio])SOCIOS[socio]={};
        Object.keys(nS[socio]).forEach(function(mk){SOCIOS[socio][mk]=nS[socio][mk];});
      });
      activeSocios=new Set(Object.keys(SOCIOS));
    }
    if(Object.keys(nEM).length>0){
      purgeMesesSheet(EGRESOS_META);
      Object.keys(nEM).forEach(function(eg){
        if(!EGRESOS_META[eg])EGRESOS_META[eg]={data:{},cat:nEM[eg].cat,sub:nEM[eg].sub,tipo:nEM[eg].tipo,grupo:nEM[eg].grupo};
        Object.keys(nEM[eg].data).forEach(function(mk){EGRESOS_META[eg].data[mk]=nEM[eg].data[mk];});
        if(nEM[eg].cat)EGRESOS_META[eg].cat=nEM[eg].cat;
        if(nEM[eg].sub)EGRESOS_META[eg].sub=nEM[eg].sub;
        if(nEM[eg].tipo)EGRESOS_META[eg].tipo=nEM[eg].tipo;
        if(nEM[eg].grupo)EGRESOS_META[eg].grupo=nEM[eg].grupo;
      });
      // Limpia egresos que quedaron sin ningun mes
      Object.keys(EGRESOS_META).forEach(function(k){if(Object.keys(EGRESOS_META[k].data).length===0)delete EGRESOS_META[k];});
    }
    Object.keys(nP).forEach(function(k){
      if(!PASARELAS[k])PASARELAS[k]={};
      Object.keys(PASARELAS[k]).forEach(function(mk){if(mesesSheet.has(mk))delete PASARELAS[k][mk];});
      Object.keys(nP[k]).forEach(function(mk){PASARELAS[k][mk]=nP[k][mk];});
    });
    rebuildAllMonths();
    rebuildYearSelect();
    buildEgFilterOptions();
    var now=new Date();
    var hora=now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    var fecha=now.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    document.getElementById('lastUpd').textContent='Act. '+hora;
    document.getElementById('modeBadge').textContent='En vivo';
    document.getElementById('modeBadge').className='live-badge badge-live';
    document.getElementById('liveDot').className='live-dot dot-live';
    document.getElementById('dataBanner').className='banner live';
    document.getElementById('dataBanner').innerHTML='<span>&#128994;</span><span>Datos actualizados desde <strong>Google Sheets</strong> el <strong>'+fecha+'</strong> a las <strong>'+hora+'</strong>.</span>';
    // Guardar snapshot en localStorage para que persista entre refrescos
    try{
      var snapshot={ts:Date.now(),SOCIOS:SOCIOS,PASARELAS:PASARELAS,EGRESOS_META:EGRESOS_META,ALL_MONTHS:ALL_MONTHS.slice(),diag:{header:header,meses:mesesOrdenados,cols:colCambios,hayMayoSheet:hayMayoSheet,total:diag.total,procesadas:diag.procesadas}};
      localStorage.setItem('dashboardSF_v1',JSON.stringify(snapshot));
    }catch(e){console.warn('No se pudo guardar en localStorage:',e);}
    setLoading(false);
    render();
    var banner=document.getElementById('dataBanner');
    if(banner){var prev=document.getElementById('diagPanel');if(prev)prev.remove();banner.insertAdjacentHTML('afterend',diagHtml);}
    showToast('Datos actualizados correctamente','ok');
  }catch(err){
    setLoading(false);
    console.error(err);
    showToast('Error: '+err.message,'err',6000);
  }
}

function loadFromCache(){
  try{
    var raw=localStorage.getItem('dashboardSF_v1');
    if(!raw)return false;
    var snap=JSON.parse(raw);
    if(!snap||!snap.SOCIOS||!snap.EGRESOS_META)return false;
    Object.keys(SOCIOS).forEach(function(k){delete SOCIOS[k];});
    Object.assign(SOCIOS,snap.SOCIOS);
    Object.keys(PASARELAS).forEach(function(k){delete PASARELAS[k];});
    Object.assign(PASARELAS,snap.PASARELAS||{});
    Object.keys(EGRESOS_META).forEach(function(k){delete EGRESOS_META[k];});
    Object.assign(EGRESOS_META,snap.EGRESOS_META);
    ALL_MONTHS.length=0;
    (snap.ALL_MONTHS||[]).forEach(function(k){ALL_MONTHS.push(k);});
    activeSocios=new Set(Object.keys(SOCIOS));
    rebuildYearSelect();
    buildEgFilterOptions();
    var d=new Date(snap.ts);
    var hora=d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    var fecha=d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    var badge=document.getElementById('modeBadge');
    if(badge){badge.textContent='En vivo (cache)';badge.className='live-badge badge-live';}
    var dot=document.getElementById('liveDot');if(dot)dot.className='live-dot dot-live';
    var lu=document.getElementById('lastUpd');if(lu)lu.textContent='Cache '+hora;
    var ban=document.getElementById('dataBanner');
    if(ban){ban.className='banner live';ban.innerHTML='<span>&#128994;</span><span>Datos cargados desde cache del navegador (<strong>'+fecha+' '+hora+'</strong>). Haz clic en <strong>Actualizar</strong> para refrescar desde el Sheet.</span>';}
    return true;
  }catch(e){console.warn('Error al leer cache:',e);return false;}
}

// Inicialización: construir meses dinámicamente desde datos hardcodeados
rebuildAllMonths();
rebuildYearSelect();
buildEgFilterOptions();
// Si hay datos guardados de una sesión anterior, los carga; si no, usa el respaldo hardcodeado
var hadCache=loadFromCache();
render();
if(!hadCache){
  // Primera vez: intenta cargar automáticamente desde el Sheet
  setTimeout(function(){reloadFromSheet();},300);
}
</script>

</html>
