/* ═══════════════════════════════════════
   CSV PARSER
═══════════════════════════════════════ */
function parseCSV(text){
  var rows=[],cur='',inQ=false,row=[];
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='"'){inQ=!inQ;continue;}
    if(c===','&&!inQ){row.push(cur.trim());cur='';continue;}
    if((c==='\n'||c==='\r')&&!inQ){
      if(cur||row.length){row.push(cur.trim());rows.push(row);}
      cur='';row=[];if(c==='\r'&&text[i+1]==='\n')i++;continue;
    }
    cur+=c;
  }
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows;
}

function cleanNum(s){
  if(!s)return 0;
  var n=parseFloat(String(s).replace(/[$\s]/g,'').replace(/\./g,'').replace(',','.'));
  return isNaN(n)?0:Math.abs(n);
}

function mkKey(mes,anio){
  var m=parseInt(mes,10),y=parseInt(anio,10);
  if(isNaN(m)||isNaN(y)||m<1||m>12||y<2020)return null;
  return y+'-'+m;
}

/* ═══════════════════════════════════════
   RELOAD FROM GOOGLE SHEETS
   Columnas Mercury USA (hoja de transacciones):
   Tipo Ingresos -> col 19 (Socio Abono)
   Tipo Egresos  -> col 20 (Debitos-Gastos)
   Mes           -> col 22
   Año           -> col 23
   Amount        -> col 2 (valor absoluto)
═══════════════════════════════════════ */
async function reloadFromSheet(){
  setLoading(true,'Conectando con Google Sheets...');
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID_MERCURY;
  try{
    var res=await fetch(url+'&t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status+'. Verifica que el Sheet sea publico (cualquier persona con el enlace puede ver).');
    var text=await res.text();
    setLoading(true,'Procesando datos...');
    var rows=parseCSV(text);
    if(rows.length<2)throw new Error('El Sheet parece vacio.');

    // Find header row (has "Date" and "Tipo Ingresos" or "Mes")
    var hdrIdx=-1;
    for(var i=0;i<Math.min(rows.length,20);i++){
      var r=rows[i].join(',').toLowerCase();
      if(r.includes('date')&&r.includes('mes')){hdrIdx=i;break;}
    }
    if(hdrIdx<0){
      // Try to find the transaction table by looking for "Tipo Ingresos" header
      for(var i=0;i<Math.min(rows.length,50);i++){
        var r=rows[i].join(',').toLowerCase();
        if(r.includes('tipo ingresos')&&r.includes('tipo egresos')){hdrIdx=i;break;}
      }
    }
    if(hdrIdx<0)throw new Error('No se encontro la fila de encabezado. Verifica que la hoja Mercury USA tenga las columnas correctas.');

    var header=rows[hdrIdx].map(function(h){return h.toLowerCase().trim();});
    var iAmount=header.findIndex(function(h){return h==='amount'||h.includes('monto');});
    var iMes=header.findIndex(function(h){return h==='mes';});
    var iAnio=header.findIndex(function(h){return h==='año'||h==='anio'||h==='year';});
    var iTipoIn=header.findIndex(function(h){return h.includes('tipo ingreso')||h.includes('socio abono')||h.includes('abono');});
    var iTipoEg=header.findIndex(function(h){return h.includes('tipo egreso')||h.includes('debito')||h.includes('debitos');});

    if(iMes<0||iAnio<0)throw new Error('No se encontraron las columnas Mes y Ano. Revisa el encabezado de la hoja Mercury USA.');

    var newSocios={},newEgresos={},newPas={Stripe:{},Dlocal:{},'Mercury Cashback':{},'Inversion LR':{},'Inversion JT':{}};

    rows.slice(hdrIdx+1).forEach(function(row){
      if(!row[iMes]&&!row[iAnio])return;
      var mk=mkKey(row[iMes],row[iAnio]);
      if(!mk)return;
      var amount=iAmount>=0?cleanNum(row[iAmount]):0;
      if(amount<=0)return;
      var tipoIn=iTipoIn>=0?(row[iTipoIn]||'').trim():'';
      var tipoEg=iTipoEg>=0?(row[iTipoEg]||'').trim():'';

      if(tipoIn){
        var tl=tipoIn.toLowerCase();
        if(tl.includes('stripe')){newPas.Stripe[mk]=(newPas.Stripe[mk]||0)+amount;}
        else if(tl.includes('dlocal')||tl.includes('pingpong')){newPas.Dlocal[mk]=(newPas.Dlocal[mk]||0)+amount;}
        else if(tl.includes('cashback')){newPas['Mercury Cashback'][mk]=(newPas['Mercury Cashback'][mk]||0)+amount;}
        else if(tl.includes('inversion lr')||tl.includes('inversion_lr')){newPas['Inversion LR'][mk]=(newPas['Inversion LR'][mk]||0)+amount;}
        else if(tl.includes('inversion jt')||tl.includes('inversion_jt')){newPas['Inversion JT'][mk]=(newPas['Inversion JT'][mk]||0)+amount;}
        else if(tipoIn&&!tl.includes('interese')&&!tl.includes('global')){
          if(!newSocios[tipoIn])newSocios[tipoIn]={};
          newSocios[tipoIn][mk]=(newSocios[tipoIn][mk]||0)+amount;
        }
      }
      if(tipoEg&&tipoEg.length>1){
        if(!newEgresos[tipoEg])newEgresos[tipoEg]={};
        newEgresos[tipoEg][mk]=(newEgresos[tipoEg][mk]||0)+amount;
      }
    });

    var hasSocios=Object.keys(newSocios).length>0;
    var hasEgresos=Object.keys(newEgresos).length>0;

    if(hasSocios){
      Object.keys(SOCIOS).forEach(function(k){delete SOCIOS[k];});
      Object.keys(newSocios).forEach(function(k){SOCIOS[k]=newSocios[k];});
      activeSocios=new Set(Object.keys(SOCIOS));
    }
    if(hasEgresos){
      Object.keys(EGRESOS).forEach(function(k){delete EGRESOS[k];});
      Object.keys(newEgresos).forEach(function(k){EGRESOS[k]=newEgresos[k];});
      activeEgresos=new Set(Object.keys(EGRESOS));
    }
    Object.keys(newPas).forEach(function(k){PASARELAS[k]=newPas[k];});

    // Rebuild months list
    var allMK=new Set();
    [SOCIOS,EGRESOS,PASARELAS].forEach(function(obj){
      Object.values(obj).forEach(function(d){Object.keys(d).forEach(function(k){allMK.add(k);});});
    });
    ALL_MONTHS.length=0;
    Array.from(allMK).filter(function(k){return /^\d{4}-\d{1,2}$/.test(k);}).sort(function(a,b){
      var pa=a.split('-'),pb=b.split('-');
      var ya=+pa[0],yb=+pb[0],ma=+pa[1],mb=+pb[1];
      return ya!==yb?ya-yb:ma-mb;
    }).forEach(function(k){ALL_MONTHS.push(k);});
    rebuildYearSelect();

    var now=new Date();
    document.getElementById('lastUpdated').textContent='Act. '+now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('modeBadge').textContent='🟢 EN VIVO';
    document.getElementById('modeBadge').className='live-badge live';
    document.getElementById('liveDot').style.background='var(--green)';
    document.getElementById('dataBanner').className='banner live';
    document.getElementById('dataBanner').innerHTML='<span>🟢</span><div>Datos actualizados desde <strong>Google Sheets</strong> el '+now.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})+' a las '+now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})+'. Haz clic en <strong>Actualizar</strong> para refrescar.</div>';
    document.getElementById('dataSubtitle').textContent='Panel financiero en vivo · Google Sheets · USD';

    setLoading(false);
    render();
    showToast('Datos actualizados correctamente ✓','ok');
  }catch(err){
    setLoading(false);
    console.error(err);
    showToast('Error: '+err.message,'err',6000);
  }
}

function rebuildYearSelect(){
  var sel=document.getElementById('yrSel');
  var cur=sel.value;
  var years=[...new Set(ALL_MONTHS.map(function(k){return k.split('-')[0];}))].sort().reverse();
  sel.innerHTML='<option value="all">Todos los años</option>';
  years.forEach(function(y){var o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o);});
  sel.value=cur;
}

function doEgresos(months,labels){buildChips('egresos');var allEKeys=Object.keys(EGRESOS);var keys=allEKeys.filter(function(e){return activeEgresos.has(e);});var tots=keys.map(function(name){return{name:name,color:EC_C[allEKeys.indexOf(name)%EC_C.length],total:months.reduce(function(s,k){return s+(EGRESOS[name][k]||0);},0)};}).sort(function(a,b){return b.total-a.total;});var grand=tots.reduce(function(s,t){return s+t.total;},0);var maxT=Math.max.apply(null,tots.map(function(t){return t.total;}).concat([1]));setKPI([{l:'Total egresos',v:fmt(grand),s:keys.length+' categoria(s)',c:'var(--red)'},{l:'Mayor gasto',v:tots[0]?tots[0].name:'--',s:fmt(tots[0]?tots[0].total:0),c:'var(--amber)'},{l:'Categorias activas',v:tots.filter(function(t){return t.total>0;}).length,s:'En el periodo',c:'var(--text2)'},{l:'Prom./mes',v:fmt(months.length?grand/months.length:0),s:'Egresos seleccionados',c:'var(--purple)'}]);var top12=tots.slice(0,12);var trows=tots.map(function(t){var p=grand?(t.total/grand*100).toFixed(1):0;return'<tr><td style="font-family:\'DM Sans\'"><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot2" style="background:'+t.color+'"></span>'+t.name+'</span></td><td class="neg">'+fmt(t.total)+'</td><td>'+p+'%<div class="bar-bg"><div class="bar-fill" style="width:'+Math.round(t.total/maxT*100)+'%;background:'+t.color+'"></div></div></td><td style="color:var(--text2)">'+fmt(months.length?t.total/months.length:0)+'</td></tr>';}).join('');document.getElementById('mainArea').innerHTML='<div class="cs"><div class="st">Top egresos - mensual apilado</div><div style="height:280px"><canvas id="cEgr"></canvas></div></div><div class="cs"><div class="st">Top 10 por volumen</div><div style="height:280px"><canvas id="cEH"></canvas></div></div><div class="ts"><div class="th2"><span>Detalle de egresos</span><span style="color:var(--text3)">'+tots.length+' categorias</span></div><table><thead><tr><th>Categoria</th><th>Total</th><th>Share</th><th>Prom./mes</th></tr></thead><tbody>'+trows+'</tbody></table></div>';charts.egr=new Chart(document.getElementById('cEgr'),{type:'bar',data:{labels:labels,datasets:top12.filter(function(t){return t.total>0;}).map(function(t){return{label:t.name,data:months.map(function(k){return EGRESOS[t.name][k]||0;}),backgroundColor:t.color+'55',borderColor:t.color,borderWidth:1,borderRadius:2};})},options:(function(){var o=baseOpts();o.scales.x.stacked=true;o.scales.y.stacked=true;return o;})()});var bo2=baseOpts();bo2.indexAxis='y';bo2.plugins.legend={display:false};charts.eh=new Chart(document.getElementById('cEH'),{type:'bar',data:{labels:top12.map(function(t){return t.name;}),datasets:[{label:'Total',data:top12.map(function(t){return t.total;}),backgroundColor:top12.map(function(t){return t.color+'66';}),borderColor:top12.map(function(t){return t.color;}),borderWidth:1,borderRadius:3}]},options:bo2});}

function doRecurrentes(months,labels){buildChips('none');var rec=RECURRENTES.filter(function(r){return EGRESOS[r];});var avgs=rec.map(function(name){var actMons=months.filter(function(k){return EGRESOS[name][k]>0;});var total=months.reduce(function(s,k){return s+(EGRESOS[name][k]||0);},0);return{name:name,total:total,avg:actMons.length?total/actMons.length:0,meses:actMons.length};}).filter(function(r){return r.total>0;}).sort(function(a,b){return b.avg-a.avg;});var grand=avgs.reduce(function(s,r){return s+r.total;},0);var top=avgs[0]||{name:'--',avg:0};var maxTot=Math.max.apply(null,avgs.map(function(r){return r.total;}).concat([1]));setKPI([{l:'Total recurrentes',v:fmt(grand),s:months.length+' mes(es)',c:'var(--red)'},{l:'Mayor promedio',v:top.name,s:fmt(top.avg)+'/mes',c:'var(--amber)'},{l:'Categorias recurrentes',v:avgs.length,s:'Con gasto en periodo',c:'var(--text2)'},{l:'Prom. total/mes',v:fmt(months.length?grand/months.length:0),s:'Todos los recurrentes',c:'var(--purple)'}]);var trows=avgs.map(function(r,i){var p=grand?(r.total/grand*100).toFixed(1):0;return'<tr><td style="font-family:\'DM Sans\'"><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot2" style="background:'+RC[i%RC.length]+'"></span>'+r.name+'</span></td><td class="neg">'+fmt(r.total)+'</td><td style="color:var(--text3)">'+r.meses+'</td><td class="neg">'+fmt(r.avg)+'</td><td>'+p+'%<div class="bar-bg"><div class="bar-fill" style="width:'+Math.round(r.total/maxTot*100)+'%;background:'+RC[i%RC.length]+'"></div></div></td></tr>';}).join('');var rhH=Math.max(220,avgs.length*32+60);document.getElementById('mainArea').innerHTML='<div class="cs"><div class="st">Evolucion egresos recurrentes</div><div style="height:260px"><canvas id="cRec"></canvas></div></div><div class="cs"><div class="st">Promedio mensual por categoria recurrente</div><div style="height:'+rhH+'px"><canvas id="cRH"></canvas></div></div><div class="ts"><div class="th2"><span>Comparativa recurrentes</span><span style="color:var(--text3)">'+avgs.length+' categorias</span></div><table><thead><tr><th>Categoria</th><th>Total periodo</th><th>Meses activos</th><th>Prom./mes activo</th><th>Share</th></tr></thead><tbody>'+trows+'</tbody></table></div>';charts.rec=new Chart(document.getElementById('cRec'),{type:'line',data:{labels:labels,datasets:avgs.map(function(r,i){return{label:r.name,data:months.map(function(k){return EGRESOS[r.name][k]||0;}),backgroundColor:RC[i%RC.length]+'22',borderColor:RC[i%RC.length],borderWidth:2,pointRadius:3,tension:.3,fill:false};})},options:baseOpts()});var bo3=baseOpts();bo3.indexAxis='y';bo3.plugins.legend={display:false};bo3.plugins.tooltip.callbacks={label:function(ctx){return' $'+ctx.raw+'/mes';}}; charts.rh=new Chart(document.getElementById('cRH'),{type:'bar',data:{labels:avgs.map(function(r){return r.name;}),datasets:[{label:'Prom./mes',data:avgs.map(function(r){return Math.round(r.avg);}),backgroundColor:avgs.map(function(_,i){return RC[i%RC.length]+'66';}),borderColor:avgs.map(function(_,i){return RC[i%RC.length];}),borderWidth:1,borderRadius:3}]},options:bo3});}

document.getElementById('yrSel').addEventListener('change',render);
document.getElementById('mnSel').addEventListener('change',render);
document.getElementById('lastUpdated').textContent='Respaldo May 2026';
render();
</script>
